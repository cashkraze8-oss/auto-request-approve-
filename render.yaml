services:
  - type: web
    name: telegram-approve-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: FIREBASE_CREDENTIALS
        sync: false
